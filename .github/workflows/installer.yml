name: Installer

# Wraps the stiva-<version>-windows-x64.7z already attached to a release into a
# Setup.exe (Inno Setup wizard + uninstaller) and uploads it to the same release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the exe from the release
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # The asset may land a moment after the release is published.
          for ($i = 0; $i -lt 12; $i++) {
            gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "stiva-*-windows-x64.7z" --dir dist --clobber
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 10
          }
          if ($LASTEXITCODE -ne 0) { throw "No stiva-*-windows-x64.7z asset on $env:TAG" }
          7z x -y -odist (Get-ChildItem dist\stiva-*-windows-x64.7z).FullName
          if (-not (Test-Path dist\stiva.exe)) { throw "stiva.exe not found in the archive" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist" installer\stiva.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload to the release
        shell: pwsh
        run: gh release upload $env:TAG "installer\output\stiva-$env:VERSION-windows-x64-setup.exe" --repo $env:GITHUB_REPOSITORY --clobber
