name: CI

# Every push builds the Windows exe and the Linux AppImage the same way a release does, runs the tests and
# checks the formatting. The exe and the AppImage are kept for a week as artifacts, to try them before a
# release is made.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: stiva-windows-x64
          path: target/release/stiva.exe
          retention-days: 7

  # The tests that run a real ffmpeg use the build Stiva itself downloads on Linux: the newest release branch from
  # FFmpeg-Builds, checked against its SHA-256 as Stiva does.
  linux-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Get ffmpeg
        run: |
          base=https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest
          curl -fsSL --retry 3 "$base/checksums.sha256" -o checksums.sha256
          name=$(awk '{print $2}' checksums.sha256 | grep -E '^ffmpeg-n[0-9]+\.[0-9]+-latest-linux64-gpl-[0-9]+\.[0-9]+\.tar\.xz$' | sort -V | tail -1)
          echo "using $name"
          curl -fsSL --retry 3 "$base/$name" -o ffmpeg.tar.xz
          echo "$(grep " $name\$" checksums.sha256 | cut -d' ' -f1)  ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf ffmpeg.tar.xz -C "$RUNNER_TEMP/ffmpeg" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          echo "STIVA_FFDIR=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --locked

  # Built on the oldest Ubuntu still offered, so the AppImage runs on anything newer than that.
  linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Pack the AppImage
        run: packaging/linux/build-appimage.sh "0.0.0-ci" target/release/stiva dist
      - name: Start it
        # A window needs a display and a GL driver; the program is still running after 15 seconds if it came up.
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0
          chmod +x dist/*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1 HOME="$RUNNER_TEMP/home" XDG_DATA_HOME="$RUNNER_TEMP/home/data"
          mkdir -p "$HOME"
          code=0
          timeout 15 xvfb-run -a dist/stiva-0.0.0-ci-linux-x86_64.AppImage || code=$?
          echo "exit code: $code"
          test "$code" = 124
      - uses: actions/upload-artifact@v4
        with:
          name: stiva-linux-x86_64-appimage
          path: dist/*.AppImage
          retention-days: 7

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
