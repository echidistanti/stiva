[package]
name = "stiva"
version = "0.1.0"
edition = "2024"
description = "Windows video transcoder with a queue and presets. ffmpeg does the work."
license = "MIT"
repository = "https://github.com/echidistanti/stiva"

[dependencies]
dirs = "7.0.0"
eframe = "0.37.0"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.5.2"
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
