[package]
name = "stiva"
version = "0.1.1"
edition = "2024"
description = "Windows video transcoder with a queue and presets. ffmpeg does the work."
license = "MIT"
repository = "https://github.com/echidistanti/stiva"

[dependencies]
dirs = "7.0.0"
eframe = "0.37.0"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = { version = "0.25.0", default-features = false }
sha2 = "0.11.1"
ureq = "3.5.2"

[target.'cfg(windows)'.dependencies]
# The progress on the taskbar button and the notifications. Same major as the one eframe's dependencies already bring.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Data_Xml_Dom",
    "UI_Notifications",
] }
raw-window-handle = "0.6"
windows-registry = "0.6"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
